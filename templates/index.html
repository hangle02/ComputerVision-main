<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SmartDoc Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  
  <div class="app-header">
    <h1>SmartDoc: Document Scanner</h1>
    <h2>Computer Vision & Linear Algebra Pipeline</h2>
  </div>

  <main class="container">
    <div class="cam-col" id="col-1">
      
      <button id="install-btn" class="install-btn" style="display: none;">📲 Install App</button>

      <div class="controls">
        <label class="desktop-only" style="font-weight: bold;">IP Camera Source:</label>
        <input type="text" id="src-1" placeholder="http://192.168.x.x:8080/video" />
        <button onclick="setSource(1)" class="btn-connect">Connect stream</button>
        <button onclick="stopSource(1)" class="stop">Stop stream</button>
      </div>

      <div class="video-box">
        <img id="video-1" 
             src="/static/images/default-stream.gif" 
             onerror="handleBrokenStream(this)" 
             alt="Live Video Stream" />
      </div>

      <div class="desktop-step-controls">
        <button class="step-btn" onclick="captureAndProcess(1, 'edges')">1. Show Edges</button>
        <button class="step-btn" onclick="captureAndProcess(1, 'contours')">2. Find Document</button>
        <button class="step-btn" onclick="captureAndProcess(1, 'warp')">3. Perspective Warp</button>
        <button class="step-btn" onclick="captureAndProcess(1, 'all')" style="background-color: #27ae60;">4. Full Scan</button>
      </div>

      <div class="results-wrapper">
        <div class="image-box">
          <h3>Original Frame</h3>
          <img id="captured-1" src="/static/images/default-capture.png" alt="Captured Frame" />
        </div>

        <div class="fragment-box">
          <div class="result-header">
              <h3>Processed Result (<span id="current-step-label">None</span>)</h3>
              <button class="rotate-btn" onclick="rotateImage(1)">↻ Rotate 90°</button>
          </div>
          <img id="fragment-1" src="/static/images/default-processed.png" alt="Processed Output" />
          <div class="process-meta" id="proc-time-1">Process time: -- ms</div>
          <div id="matrix-display-1" class="matrix-box" style="display:none;"></div>
        </div>
      </div>
      
    </div>
  </main>

  <nav class="mobile-bottom-bar">
    <button class="action-btn" onclick="captureAndProcess(1, 'edges')">
      <span class="icon">🔍</span> Edges
    </button>
    <button class="action-btn" onclick="captureAndProcess(1, 'contours')">
      <span class="icon">📄</span> Find
    </button>
    <button class="action-btn" onclick="captureAndProcess(1, 'warp')">
      <span class="icon">📐</span> Warp
    </button>
    <button class="action-btn action-btn-main" onclick="captureAndProcess(1, 'all')">
      <span class="icon">📸</span> Scan
    </button>
  </nav>

  <script src="/static/main.js"></script>
</body>
</html>
