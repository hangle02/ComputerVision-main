<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SmartDoc Scanner - CV & Linear Algebra Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Thêm một chút CSS inline cho đẹp và rõ ràng báo cáo */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; }
    h1 { text-align: center; color: #2c3e50; }
    h2 { text-align: center; color: #7f8c8d; font-size: 1.2em; font-weight: 400; margin-bottom: 30px; }
    
    .matrix-box {
      background: #2c3e50;
      color: #00ff00;
      font-family: monospace;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      display: none; /* Ẩn đi khi chưa có data */
      white-space: pre-wrap;
      font-size: 14px;
    }
    
    .step-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    
    .step-btn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #3498db;
      color: white;
      transition: 0.3s;
    }
    
    .step-btn:hover { background-color: #2980b9; }
    .step-btn.active { background-color: #e74c3c; font-weight: bold; }
  </style>
</head>
<body>
  <h1>SmartDoc: Document Scanner</h1>
  <h2>Computer Vision & Linear Algebra (Homography) Pipeline</h2>
  
  <div class="container" style="display: flex; justify-content: center;">
    <div class="cam-col" id="col-1" style="max-width: 800px; width: 100%;">
      
      <div class="controls" style="text-align: center; margin-bottom: 20px;">
        <label style="font-weight: bold;">IP Camera Source:</label>
        <input type="text" id="src-1" placeholder="http://192.168.x.x:8080/video" style="padding: 8px; width: 300px;"/>
        <button onclick="setSource(1)" style="padding: 8px 15px;">Connect stream</button>
        <button onclick="stopSource(1)" class="stop" style="padding: 8px 15px;">Stop stream</button>
      </div>

      <div class="video-box" style="text-align: center;">
        <img id="video-1" src="" alt="Live Video Stream" style="width: 100%; max-width: 640px; border: 2px solid #ccc; border-radius: 8px;"/>
      </div>

      <div class="step-controls">
        <button class="step-btn" onclick="captureAndProcess(1, 'edges')">1. Show Edges (Canny)</button>
        <button class="step-btn" onclick="captureAndProcess(1, 'contours')">2. Find Document (Contours)</button>
        <button class="step-btn" onclick="captureAndProcess(1, 'warp')">3. Perspective Warp (Homography)</button>
        <button class="step-btn" onclick="captureAndProcess(1, 'all')" style="background-color: #27ae60;">4. Full Scan (Threshold)</button>
      </div>

      <div style="display: flex; gap: 20px; margin-top: 30px;">
        <div class="image-box" style="flex: 1;">
          <h3 style="border-bottom: 2px solid #3498db; padding-bottom: 5px;">Original Frame</h3>
          <img id="captured-1" src="" alt="Captured Frame" style="width: 100%; border: 1px solid #ddd;" />
        </div>

        <div class="fragment-box" style="flex: 1;">
          <h3 style="border-bottom: 2px solid #e74c3c; padding-bottom: 5px;">Processed Result (<span id="current-step-label">None</span>)</h3>
          <img id="fragment-1" src="" alt="Processed Output" style="width: 100%; border: 1px solid #ddd;" />
          <div class="process-meta" id="proc-time-1" style="margin-top: 10px; font-weight: bold;">Process time: -- ms</div>
          
          <div id="matrix-display-1" class="matrix-box">
            // Homography Matrix (3x3) will appear here
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
