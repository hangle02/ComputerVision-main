<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Assignment Filters Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Computer Vision - Assignment 2</h1>
  
  <div class="container">
    <div class="cam-col" id="col-1">
      <div class="controls">
        <label>IP/URL Camera 1</label>
        <input type="text" id="src-1" placeholder="rtsp://..., http://..., hoặc số 0" />
        <button onclick="setSource(1)">Connect</button>
        <button onclick="stopSource(1)" class="stop">Stop</button>
      </div>

      <div class="video-box">
        <img id="video-1" src="" alt="camera1 stream"/>
        <button class="capture-btn" aria-label="Capture" onclick="capture(1)">&#128247;</button>
      </div>

      <div class="image-box">
        <h3>Original Capture</h3>
        <img id="captured-1" src="" alt="captured" />
      </div>

      <div class="fragment-box">
        <h3>Filtered Result</h3>
        <img id="fragment-1" src="" alt="fragment" />
        <div class="process-meta" id="proc-time-1">Process time: --</div>
      </div>
    </div>

    <div class="cam-col" id="col-2">
      <div class="controls">
        <label>IP/URL Camera 2</label>
        <input type="text" id="src-2" placeholder="rtsp://..., http://..., hoặc số 1" />
        <button onclick="setSource(2)">Connect</button>
        <button onclick="stopSource(2)" class="stop">Stop</button>
      </div>

      <div class="video-box">
        <img id="video-2" src="" alt="camera2 stream"/>
        <button class="capture-btn" aria-label="Capture" onclick="capture(2)">&#128247;</button>
      </div>

      <div class="image-box">
        <h3>Original Capture</h3>
        <img id="captured-2" src="" alt="captured" />
      </div>

      <div class="fragment-box">
        <h3>Filtered Result</h3>
        <img id="fragment-2" src="" alt="fragment" />
        <div class="process-meta" id="proc-time-2">Process time: --</div>
      </div>
    </div>
  </div>

  <div class="control-group" style="margin-top: 20px;">
    <label for="filter-select" style="font-weight: bold; font-size: 1.2em;">Filter:</label>
    <br><br>
    <select id="filter-select" class="form-control" style="padding: 10px; font-size: 16px;">
        <option value="all">--- Choose filter ---</option>
        
        <optgroup label="Basic Conversion">
            <option value="gray">1. Grayscale Conversion</option>
        </optgroup>

        <optgroup label="Smoothing / Blurring">
            <option value="gaussian">2. Gaussian Blur</option>
            <option value="median">3. Median Blur </option>
            <option value="bilateral">7. Bilateral Filter </option>
        </optgroup>

        <optgroup label="Edge Detection & Sharpening">
            <option value="sobel">4. Sobel X (X-Direction)</option>
            <option value="laplacian">5. Laplacian</option>
            <option value="sharpen">6. Sharpening </option>
        </optgroup>

        <optgroup label="Thresholding & Morphology">
            <option value="threshold">8. Thresholding</option>
            <option value="erode">9. Erosion</option>
            <option value="dilate">10. Dilation</option>
        </optgroup>
    </select>
  </div>

  <br>
  <button onclick="capture(1)" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
      Capture & Filtering (Camera 1)
  </button>

  <script src="/static/main.js"></script>
</body>
</html>
